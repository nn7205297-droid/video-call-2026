<!DOCTYPE html>
<html lang="ps">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Camera</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin-top: 30px;
    }

    video {
      width: 90%;
      max-width: 500px;
      height: 300px;
      object-fit: cover;
      background: #222;
      border-radius: 15px;
      margin-top: 20px;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      background: #2196f3;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    #stopBtn {
      background: #e53935;
      margin-left: 8px;
    }
  </style>
</head>

<body>

  <h2>📹 زما کمره</h2>

  <video id="video" autoplay playsinline></video>

  <br>

  <button onclick="startCamera()">📷 کمره خلاصول</button>
  <button id="stopBtn" onclick="stopCamera()">⛔ بندول</button>

  <script>
    const video = document.getElementById("video");
    let stream = null;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
      } catch (error) {
        alert("کمرې ته اجازه ورکړه، بیا هڅه وکړه.");
        console.log(error);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        stream = null;
      }
    }
  </script>

</body>
</html>
