
<!DOCTYPE html>
<html lang="ps">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Way Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .header {
      padding: 18px;
      background: #1c1c1c;
      font-size: 22px;
      font-weight: bold;
    }

    .video-box {
      width: 100%;
      height: 65vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .message {
      padding: 15px;
      color: #ccc;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 15px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 16px;
      color: white;
      background: #2563eb;
    }

    button:active {
      transform: scale(.96);
    }

    .stop {
      background: #dc2626;
    }

    .status {
      margin: 5px 15px 20px;
      padding: 12px;
      border-radius: 10px;
      background: #222;
      color: #ddd;
    }
  </style>
</head>

<body>

  <div class="header">
    📹 One Way Video
  </div>

  <div class="video-box">
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <div class="message">
    بل کس چې کیمره شریکوي، ویډیو به دلته ښکاره شي.
  </div>

  <div class="buttons">
    <button onclick="joinViewer()">👁️ ویډیو لیدل</button>
    <button class="stop" onclick="stopVideo()">⛔ بندول</button>
  </div>

  <div class="status" id="status">
    حالت: وصل کېدو ته تیار
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const remoteVideo = document.getElementById("remoteVideo");
    const status = document.getElementById("status");

    let peerConnection;

    const config = {
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]
    };

    function joinViewer() {
      status.innerText = "حالت: د ویډیو انتظار...";

      socket.emit("join-viewer");

      peerConnection = new RTCPeerConnection(config);

      peerConnection.ontrack = (event) => {
        remoteVideo.srcObject = event.streams[0];
        status.innerText = "حالت: ویډیو وصل شوه ✅";
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit("ice-candidate", event.candidate);
        }
      };
    }

    socket.on("offer", async (offer) => {
      if (!peerConnection) {
        peerConnection = new RTCPeerConnection(config);

        peerConnection.ontrack = (event) => {
          remoteVideo.srcObject = event.streams[0];
          status.innerText = "حالت: ویډیو وصل شوه ✅";
        };

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit("ice-candidate", event.candidate);
          }
        };
      }

      await peerConnection.setRemoteDescription(offer);

      const answer = await peerConnection.createAnswer();

      await peerConnection.setLocalDescription(answer);

      socket.emit("answer", answer);
    });

    socket.on("ice-candidate", async (candidate) => {
      try {
        if (peerConnection) {
          await peerConnection.addIceCandidate(candidate);
        }
      } catch (error) {
        console.log(error);
      }
    });

    socket.on("sharer-ready", () => {
      status.innerText = "حالت: شریک کوونکی وصل شو...";
    });

    socket.on("peer-disconnected", () => {
      remoteVideo.srcObject = null;
      status.innerText = "حالت: بل کس له ویډیو ووت.";
    });

    function stopVideo() {
      if (peerConnection) {
        peerConnection.close();
       = null;
      }

      remoteVideo.srcObject = null;
      status.innerText = "حالت: ویډیو بنده شوه.";
    }
  </script>

</body>
