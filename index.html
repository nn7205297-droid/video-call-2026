<!DOCTYPE html>
<html lang="ps">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Way Video</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  width:94%;
  max-width:520px;
  margin:auto;
  padding:25px 0 50px;
}

.role{
  display:inline-block;
  padding:9px 20px;
  border-radius:25px;
  font-size:18px;
  font-weight:bold;
  margin:15px 0 5px;
}

.camera-role{
  background:#075dcc;
}

.viewer-role{
  background:#079b48;
}

.description{
  color:#ddd;
  font-size:15px;
  margin:8px 0 15px;
}

.card{
  background:#191919;
  border:1px solid #333;
  border-radius:15px;
  padding:22px;
  margin-bottom:28px;
  text-align:center;
}

h1{
  margin:0 0 25px;
  font-size:29px;
}

input{
  width:100%;
  height:55px;
  border:none;
  border-radius:10px;
  padding:0 15px;
  font-size:20px;
  margin-bottom:14px;
}

button{
  width:100%;
  height:55px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.camera-btn{
  background:#078ff0;
}

.viewer-btn{
  background:#09b957;
}

.stop-btn{
  background:#e83232;
  margin-top:12px;
}

.status{
  margin-top:20px;
  color:#00df62;
  font-size:16px;
  line-height:1.7;
}

.warning{
  background:#202020;
  border:1px solid #333;
  border-radius:12px;
  padding:15px;
  margin-top:20px;
  color:#ddd;
  line-height:1.8;
}

.warning strong{
  color:#ff3d3d;
  display:block;
}

#remoteVideo{
  width:100%;
  background:#000;
  border-radius:12px;
  margin-top:18px;
  display:none;
  max-height:70vh;
}

#localVideo{
  display:none;
}

.success{
  color:#00df62;
  margin-top:12px;
  font-size:16px;
}

.footer{
  text-align:center;
  color:#777;
  margin-top:25px;
  font-size:14px;
}

</style>
</head>

<body>

<div class="container">

  <!-- CAMERA -->

  <div style="text-align:center">

    <div class="role camera-role">
      📱 CAMERA موبایل
    </div>

    <div class="description">
      
    </div>

  </div>

  <div class="card">

    <h1>One Way Video</h1>

    <input
      id="cameraRoom"
      type="text"
      placeholder="Room ID"
      value="1234"
    >

    <button
      class="camera-btn"
      onclick="startCamera()"
    >
       Camera + Microphone فعالول
    </button>

    <div id="cameraStatus" class="status">
      Camera لا فعاله نه ده
    </div>

    <div class="warning">

      🛡️ 

      <strong>
        دلته وډو نه ښکاري.
      </strong>

    </div>

  </div>


  <!-- VIEWER -->

  <div style="text-align:center">

    <div class="role viewer-role"> 
    </div>

    <div class="description">
      
    </div>

  </div>

  <div class="card">

    <h1>One Way Video</h1>

    <input
      id="viewerRoom"
      type="text"
      placeholder="Room ID"
      value="1234"
    >

    <button
      class="viewer-btn"
      onclick="startViewer()"
    >
     ویو لیدل
    </button>

    <div id="viewerStatus" class="status">
      د بل کس د و انتظار...
    </div>

    <video
      id="remoteVideo"
      autoplay
      playsinline
      controls>
    </video>

    <div id="videoSuccess" class="success" style="display:none">
      ✓ د بل کسیو دلته ښکاري
    </div>

  </div>


  <button
    class="stop-btn"
    onclick="stopAll()"
  >
    ⛔ بندول
  </button>

  <div class="footer">
    🔒 WebRTC • One Way Video
  </div>

</div>


<video
  id="localVideo"
  autoplay
  muted
  playsinline>
</video>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let pc = null;
let localStream = null;
let roomId = "";

let isCamera = false;
let isViewer = false;


const remoteVideo =
  document.getElementById("remoteVideo");

const localVideo =
  document.getElementById("localVideo");

const cameraStatus =
  document.getElementById("cameraStatus");

const viewerStatus =
  document.getElementById("viewerStatus");

const videoSuccess =
  document.getElementById("videoSuccess");


const rtcConfig = {

  iceServers: [

    {
      urls:"stun:stun.l.google.com:19302"
    }

  ]

};


function createPeer(){

  pc = new RTCPeerConnection(rtcConfig);


  pc.onicecandidate = function(event){

    if(event.candidate){

      socket.emit(
        "ice-candidate",
        {
          roomId:roomId,
          candidate:event.candidate
        }
      );

    }

  };


  pc.ontrack = function(event){

    if(!isViewer) return;

    remoteVideo.srcObject =
      event.streams[0];

    remoteVideo.style.display =
      "block";

    videoSuccess.style.display =
      "block";

    viewerStatus.innerText =
      "ویډیو وصل شوه ✓";

    remoteVideo.play().catch(()=>{});

  };


  pc.onconnectionstatechange =
  function(){

    if(!pc) return;

    if(
      pc.connectionState === "connected"
    ){

      if(isCamera){

        cameraStatus.innerText =
          "ویډ ✓";

      }

      if(isViewer){

        viewerStatus.innerText =
          "ویډیو وصل شوه ✓";

      }

    }

  };

}


async function startCamera(){

  roomId =
    document.getElementById(
      "cameraRoom"
    ).value.trim();


  if(!roomId){

    alert("Room ID ولیکه");

    return;
  }


  isCamera = true;
  isViewer = false;


  try{

    cameraStatus.innerText =
      "Camera او Microphone اجازه وغواړي...";


    localStream =
      await navigator.mediaDevices
      .getUserMedia({

        video:true,
        audio:true

      });


    /*
      مهم:
      localVideo دلته نه ښکاره کوو.
      نو د Camera موبایل کې ویډیو نه ښکاري.
    */


    createPeer();


    localStream
      .getTracks()
      .forEach(function(track){

        pc.addTrack(
          track,
          localStream
        );

      });


    socket.emit(
      "join-room",
      roomId
    );


    cameraStatus.innerText =
      "Camera فعاله ده، د Viewer انتظار...";


  }catch(error){

    console.log(error);

    cameraStatus.innerText =
      "Camera او Microphone اجازه ورکړه.";

  }

}


async function startViewer(){

  roomId =
    document.getElementById(
      "viewerRoom"
    ).value.trim();


  if(!roomId){

    alert("Room ID ولیکه");

    return;
  }


  isViewer = true;
  isCamera = false;


  createPeer();


  socket.emit(
    "join-room",
    roomId
  );


  viewerStatus.innerText =
    "د بل کس د ویډیو انتظار...";

}


socket.on(
  "viewer-ready",
  async function(){

    if(!isCamera) return;

    if(!pc) return;


    try{

      const offer =
        await pc.createOffer();


      await pc.setLocalDescription(
        offer
      );


      socket.emit(
        "offer",
        {
          roomId:roomId,
          offer:offer
        }
      );


      cameraStatus.innerText =
        "ویډیو بل کس ته لېږل کېږي...";


    }catch(error){

      console.log(error);

    }

  }
);


socket.on(
  "offer",
  async function(offer){

    if(!isViewer) return;


    try{

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          offer
        )
      );


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      socket.emit(
        "answer",
        {
          roomId:roomId,
          answer:answer
        }
      );


    }catch(error){

      console.log(error);

    }

  }
);


socket.on(
  "answer",
  async function(answer){

    if(!isCamera) return;

    try{

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      );

    }catch(error){

      console.log(error);

    }

  }
);


socket.on(
  "ice-candidate",
  async function(candidate){

    if(!pc) return;


    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    }catch(error){

      console.log(error);

    }

  }
);


function stopAll(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(function(track){

        track.stop();

      });

    localStream = null;

  }


  if(pc){

    pc.close();

    pc = null;

  }


  remoteVideo.srcObject = null;

  remoteVideo.style.display =
    "none";

  videoSuccess.style.display =
    "none";


  cameraStatus.innerText =
    "Camera لا فعاله نه ده";

  viewerStatus.innerText =
    "د بل کس د ویډیو انتظار...";


  isCamera = false;
  isViewer = false;

}


socket.on(
  "peer-left",
  function(){

    if(!isViewer) return;

    remoteVideo.srcObject =
      null;

    remoteVideo.style.display =
      "none";

    videoSuccess.style.display =
      "none";

    viewerStatus.innerText =
      "د بل کس د ویډیو انتظار...";

  }
);

</script>

</body>
  </html>
